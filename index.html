<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Awam Ki Rai - Live Poll 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="max-w-[420px] mx-auto bg-white min-h-screen shadow-lg">
<div class="bg-[#0a7a3a] text-white p-4 text-center sticky top-0 z-10">
<h1 class="text-xl font-bold">عوام کی رائے - Live Poll</h1>
<p class="text-[10px]">Unofficial - Sirf Awam Ki Rai</p>
<div class="bg-white text-green-800 mt-3 py-2 rounded-full font-bold text-sm">Total Live Votes: <span id="totalVotes">0</span></div>
</div>
<div class="p-3 bg-yellow-50">
<h3 class="text-xs font-bold">🔥 Live Top 3:</h3>
<div id="topBars">Loading...</div>
</div>
<div id="partyList" class="grid grid-cols-2 gap-3 p-3"></div>
<div class="m-3 p-4 bg-gradient-to-r from-orange-500 to-red-500 rounded-xl text-white text-center">
<h3 class="font-bold text-sm">❤️ Support Karo</h3>
<p class="font-bold text-lg tracking-widest mt-1">JazzCash: 03264492997</p>
<button onclick="navigator.clipboard.writeText('03264492997');alert('Copy ho gaya')" class="mt-2 bg-white text-orange-600 px-4 py-1 rounded-full text-xs font-bold">Copy Number</button>
</div>
<div class="p-4"><button onclick="shareWhatsApp()" class="w-full bg-[#25D366] text-white py-3 rounded-lg font-bold">WhatsApp pe Share Karo</button></div>
</div>
<div id="popup" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
<div class="bg-white rounded-xl p-5 w-full max-w-sm">
<h3 id="pName" class="font-bold text-center"></h3>
<input id="mobile" type="number" placeholder="03xxxxxxxxx" class="w-full border-2 border-green-600 p-3 rounded-lg mt-4 text-center font-bold">
<button id="voteBtn" onclick="submitVote()" class="w-full bg-green-700 text-white py-3 rounded-lg mt-3 font-bold">Vote Confirm Karo</button>
<button onclick="closePop()" class="w-full mt-3 text-sm">Cancel</button>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY_HERE",
  authDomain: "awam-ki-rai.firebaseapp.com",
  databaseURL: "https://awam-ki-rai-default-rtdb.firebaseio.com",
  projectId: "awam-ki-rai",
  storageBucket: "awam-ki-rai.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123:web:abc"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const parties = [
  {id:'pti', name:'PTI', leader:'Imran Khan', color:'bg-red-600'},
  {id:'pmln', name:'PMLN', leader:'Nawaz Sharif', color:'bg-green-600'},
  {id:'ppp', name:'PPP', leader:'Bilawal', color:'bg-black'},
  {id:'tlp', name:'TLP', leader:'Saad Rizvi', color:'bg-yellow-500'},
  {id:'jui', name:'JUI-F', leader:'Fazal', color:'bg-gray-800'},
  {id:'ji', name:'Jamaat', leader:'Hafiz Naeem', color:'bg-green-800'},
  {id:'ttap', name:'Tahafuz Ain', leader:'Achakzai', color:'bg-blue-600'},
  {id:'barabri', name:'Barabri Party', leader:'Jawad Ahmad', color:'bg-orange-500'},
  {id:'saream', name:'Iqrar Party', leader:'Iqrar ul Hassan', color:'bg-purple-600'},
  {id:'azad', name:'Azad', leader:'Azad', color:'bg-gray-500'}
];
let votesData = {}; let selectedParty = '';
const votesRef = ref(db, 'votes_count/');
onValue(votesRef, (snapshot) => { votesData = snapshot.val() || {}; render(); });
window.render = function(){
  const list = document.getElementById('partyList'); list.innerHTML='';
  let total = Object.values(votesData).reduce((a,b)=>a+b,0);
  document.getElementById('totalVotes').innerText = total;
  let sorted = [...parties].sort((a,b)=>(votesData[b.id]||0)-(votesData[a.id]||0));
  let topHTML=''; sorted.slice(0,3).forEach(p=>{let c=votesData[p.id]||0; let perc=total?Math.round((c/total)*100):0; topHTML+=`<div class="mb-1"><div class="flex justify-between text-[11px] font-bold"><span>${p.name}</span><span>${perc}%</span></div><div class="w-full bg-gray-200 h-2 rounded"><div class="h-2 rounded ${p.color}" style="width:${perc}%"></div></div></div>`;});
  document.getElementById('topBars').innerHTML = topHTML || 'Abhi koi vote nahi';
  parties.forEach(p=>{let c=votesData[p.id]||0; list.innerHTML+=`<div class="border rounded-xl p-3 text-center"><div class="w-6 h-6 rounded-full ${p.color} mx-auto"></div><h3 class="font-bold text-xs mt-1">${p.name}</h3><p class="text-[9px] text-gray-500">${p.leader}</p><p class="text-[10px] font-bold text-green-700">${c} Votes</p><button onclick="openVote('${p.id}','${p.name}')" class="mt-2 w-full bg-green-700 text-white text-[10px] py-2 rounded-full">Vote Karo</button></div>`;});
}
window.openVote = function(id,name){ if(localStorage.getItem('myVoted')=='true'){alert('Aap vote kar chuke hain!');return;} selectedParty=id; document.getElementById('pName').innerText=name+' ko vote?'; document.getElementById('popup').classList.remove('hidden'); }
window.closePop = function(){document.getElementById('popup').classList.add('hidden');}
window.submitVote = async function(){
  let mobile = document.getElementById('mobile').value.trim();
  if(mobile.length < 11){alert('Sahi number likho');return;}
  document.getElementById('voteBtn').innerText='Checking...';
  const mobileRef = ref(db, 'voters/' + mobile);
  const snap = await get(mobileRef);
  if(snap.exists()){ alert('Is number se vote ho chuka hai!'); document.getElementById('voteBtn').innerText='Vote Confirm Karo'; return; }
  await set(mobileRef, {party: selectedParty, time: Date.now()});
  const countRef = ref(db, 'votes_count/' + selectedParty);
  const currentSnap = await get(countRef);
  let current = currentSnap.val() || 0;
  await set(countRef, current + 1);
  localStorage.setItem('myVoted','true');
  closePop();
  alert('Vote LIVE save ho gaya!');
  document.getElementById('voteBtn').innerText='Vote Confirm Karo';
}
window.shareWhatsApp = function(){ let t=`Awam Ki Rai LIVE Poll - Maine vote de diya! Aap bhi karo: ${window.location.href}`; window.open(`https://wa.me/?text=${encodeURIComponent(t)}`,'_blank'); }
</script>
</body>
</html>
