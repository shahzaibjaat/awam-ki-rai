<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Naqsha Maker - Ghar ka Naksha</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f8fafc}
header{background:#0f172a;color:#fff;padding:16px;text-align:center}
header h1{font-size:22px} header p{opacity:.7;font-size:13px;margin-top:4px}
.main{max-width:1100px;margin:20px auto;display:grid;grid-template-columns:350px 1fr;gap:20px;padding:0 16px}
@media(max-width:800px){.main{grid-template-columns:1fr}}
.form{background:#fff;padding:20px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.06);height:fit-content;position:sticky;top:20px}
.form h3{margin-bottom:14px}
label{font-size:13px;font-weight:600;margin-top:12px;display:block}
input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;background:linear-gradient(90deg,#2563eb,#0ea5e9);color:#fff;border:none;padding:12px;border-radius:10px;font-weight:700;margin-top:16px;cursor:pointer;font-size:15px}
.results{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.results{grid-template-columns:1fr}}
.plan-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.plan-card .head{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f5f9}
.plan-card .head b{font-size:14px}
.plan-card .head span{font-size:11px;background:#f1f5f9;padding:4px 8px;border-radius:12px}
canvas{width:100%;height:300px;background:#fff}
.plan-info{padding:12px 16px;font-size:12px;color:#475569}
.plan-info button{background:#000;color:#fff;border:none;padding:6px 12px;border-radius:6px;margin-top:8px;cursor:pointer;font-size:12px}
</style>
</head>
<body>
<header>
<h1>🏠 AI Naqsha Maker</h1>
<p>Apni Zameen ka Size Batao - AI 4 Naqshay Bana Dega</p>
</header>

<div class="main">
<div class="form">
<h3>Zameen ki Tafseel</h3>

<div class="row">
<div><label>Length (Feet)</label><input id="len" type="number" value="40"></div>
<div><label>Width (Feet)</label><input id="wid" type="number" value="30"></div>
</div>

<label>Marla / Kanal</label>
<select id="marla"><option>3 Marla (675 sqft)</option><option selected>5 Marla (1125 sqft)</option><option>7 Marla</option><option>10 Marla (1 Kanal ka 1/2)</option><option>1 Kanal</option></select>

<div class="row">
<div><label>Bedrooms</label><select id="bed"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div>
<div><label>Bathrooms</label><select id="bath"><option>1</option><option selected>2</option><option>3</option></select></div>
</div>

<label>Kitchen</label><select id="kit"><option>1</option><option>Open Kitchen</option></select>
<label>Car Parking?</label><select id="park"><option>Yes</option><option>No</option></select>
<label>Dukaan / Shop chahiye?</label><select id="shop"><option>No</option><option>Yes - 1 Shop</option></select>

<button class="btn" onclick="generatePlans()">✨ AI Se 4 Naqshay Banao</button>
<p style="font-size:11px;color:#64748b;margin-top:10px;text-align:center">AI aapke size ke hisaab se auto design karega</p>
</div>

<div class="results" id="results">
<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:#94a3b8">👈 Pehle size dal ke Generate pe click karo, yahan 4 naqshay ayenge</div>
</div>
</div>

<script>
function generatePlans(){
 let L = parseInt(document.getElementById('len').value) || 40;
 let W = parseInt(document.getElementById('wid').value) || 30;
 let bed = parseInt(document.getElementById('bed').value);
 
 let container = document.getElementById('results');
 container.innerHTML = '';

 let styles = [
   {name:'Modern Design', type:'modern', color:'#2563eb', desc:'Center Hall + Attached Baths'},
   {name:'Open Plan', type:'open', color:'#0ea5e9', desc:'Bari Lounge + Open Kitchen'},
   {name:'Traditional', type:'trad', color:'#f59e0b', desc:'Sehan wala Desi Design'},
   {name:'Luxury Villa', type:'lux', color:'#10b981', desc:'Big Rooms + Parking'},
 ];

 styles.forEach((s,i)=>{
   let id = 'c'+i;
   container.innerHTML += `
   <div class="plan-card">
     <div class="head"><b>${s.name}</b><span>${L}x${W} ft</span></div>
     <canvas id="${id}" width="400" height="400"></canvas>
     <div class="plan-info">${s.desc} | ${bed} Bed, ${document.getElementById('bath').value} Bath<br>
     <button onclick="downloadCanvas('${id}','${s.name}')">📥 Download Naqsha</button></div>
   </div>`;
 });

 setTimeout(()=>{
   styles.forEach((s,i)=> drawPlan('c'+i, L, W, s.type, parseInt(document.getElementById('bed').value)));
 },100);
}

function drawPlan(canvasId, L, W, style, beds){
 let c = document.getElementById(canvasId);
 let ctx = c.getContext('2d');
 let scale = 6;
 let pw = W*scale, ph = L*scale;
 let ox = (400-pw)/2, oy = (400-ph)/2;
 
 ctx.clearRect(0,0,400,400);
 ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.strokeRect(ox,oy,pw,ph);
 
 ctx.font='10px sans-serif'; ctx.fillStyle='#64748b';
 ctx.fillText(`${W} ft`, ox+pw/2-10, oy-6);
 ctx.save(); ctx.translate(ox-12, oy+ph/2); ctx.rotate(-Math.PI/2); ctx.fillText(`${L} ft`,0,0); ctx.restore();

 // Rooms logic
 let colors = {modern:'#dbeafe', open:'#e0f2fe', trad:'#fef3c7', lux:'#dcfce7'};
 ctx.fillStyle = colors[style];

 if(style==='modern'){
   // Hall center
   ctx.fillRect(ox, oy, pw, ph*0.45); ctx.strokeRect(ox, oy, pw, ph*0.45);
   ctx.fillStyle='#000'; ctx.fillText('TV Lounge / Hall', ox+10, oy+20);
   // 2 beds bottom
   for(let i=0;i<beds;i++){
     let x = ox + (i*(pw/beds)); let y = oy+ph*0.45;
     ctx.fillStyle=colors[style]; ctx.fillRect(x,y,pw/beds, ph*0.35); ctx.strokeRect(x,y,pw/beds, ph*0.35);
     ctx.fillStyle='#000'; ctx.fillText('Bedroom '+(i+1), x+8, y+15);
   }
   // Kitchen + Bath
   ctx.fillRect(ox, oy+ph*0.8, pw*0.5, ph*0.2); ctx.strokeRect(ox, oy+ph*0.8, pw*0.5, ph*0.2); ctx.fillText('Kitchen', ox+8, oy+ph*0.8+14);
   ctx.fillRect(ox+pw*0.5, oy+ph*0.8, pw*0.5, ph*0.2); ctx.strokeRect(ox+pw*0.5, oy+ph*0.8, pw*0.5, ph*0.2); ctx.fillText('Bath + Parking', ox+pw*0.5+6, oy+ph*0.8+14);
 } else if(style==='open'){
   ctx.fillRect(ox, oy, pw*0.65, ph); ctx.strokeRect(ox, oy, pw*0.65, ph); ctx.fillText('Open Lounge', ox+10, oy+20);
   for(let i=0;i<beds;i++){
     let y = oy + i*(ph/beds); ctx.fillRect(ox+pw*0.65, y, pw*0.35, ph/beds); ctx.strokeRect(ox+pw*0.65, y, pw*0.35, ph/beds); ctx.fillText('Bed '+ (i+1), ox+pw*0.65+6, y+14);
   }
 } else if(style==='trad'){
   ctx.fillRect(ox+pw*0.2, oy+ph*0.2, pw*0.6, ph*0.6); ctx.strokeRect(ox+pw*0.2, oy+ph*0.2, pw*0.6, ph*0.6); ctx.fillText('Sehan (Khula)', ox+pw*0.3, oy+ph*0.5);
   ctx.strokeRect(ox, oy, pw*0.2, ph*0.4); ctx.fillText('Bed 1', ox+5, oy+20);
   ctx.strokeRect(ox+pw*0.8, oy, pw*0.2, ph*0.4); ctx.fillText('Bed 2', ox+pw*0.8+5, oy+20);
   ctx.strokeRect(ox, oy+ph*0.6, pw, ph*0.4); ctx.fillText('Kitchen + Bath', ox+10, oy+ph*0.6+15);
 } else {
   // Luxury
   ctx.fillRect(ox, oy, pw, ph*0.3); ctx.strokeRect(ox, oy, pw, ph*0.3); ctx.fillText('Drawing + Lounge', ox+10, oy+18);
   for(let i=0;i<beds;i++){
     ctx.fillRect(ox+(i*pw/beds), oy+ph*0.3, pw/beds, ph*0.4); ctx.strokeRect(ox+(i*pw/beds), oy+ph*0.3, pw/beds, ph*0.4); ctx.fillText('Master Bed '+(i+1), ox+(i*pw/beds)+4, oy+ph*0.3+14);
   }
   ctx.fillRect(ox, oy+ph*0.7, pw, ph*0.3); ctx.strokeRect(ox, oy+ph*0.7, pw, ph*0.3); ctx.fillText('Kitchen + Car Porch + Lawn', ox+10, oy+ph*0.7+15);
 }
}

function downloadCanvas(id,name){
 let c = document.getElementById(id);
 let a = document.createElement('a');
 a.download = name+'.png';
 a.href = c.toDataURL();
 a.click();
}
</script>
</body>
</html>
